<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fazani Round Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: arena scoreboard — sticky round bar, proposal board split by game day (turns), then a player market with per-game bars against break-even. */
:root{
  --bg:#0a1120; --surface:#111a2c; --raise:#17233a; --line:#22314d; --line-soft:#1a2741;
  --fg:#e9eef8; --muted:#8e9bb6; --faint:#5d6b88;
  --accent:#27b7c4; --accent-soft:rgba(39,183,196,.14); --accent-ink:#04252a;
  --good:#3fcf8f; --good-ink:#04251a; --good-soft:rgba(63,207,143,.14); --bad:#f7889b; --bad-soft:rgba(242,99,125,.14); --warn:#f3b64b; --warn-soft:rgba(243,182,75,.15); --warn-ink:#1d1300;
  --be:#8e9bb6; --credit:#f3b64b;
  --court-a:#1d2a3f; --court-b:#152036; --court-line:rgba(255,255,255,.10);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --r:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#edf1f6; --surface:#ffffff; --raise:#f3f6fa; --line:#d6dde8; --line-soft:#e5eaf1;
  --fg:#0f1a2d; --muted:#56637d; --faint:#8592aa;
  --accent:#086672; --accent-soft:rgba(8,102,114,.10); --accent-ink:#ffffff;
  --good:#0c6a41; --good-soft:rgba(12,106,65,.10); --good-ink:#ffffff; --bad:#b02842; --bad-soft:rgba(176,40,66,.09); --warn:#7a4f04; --warn-soft:rgba(122,79,4,.11); --warn-ink:#ffffff;
  --be:#56637d; --credit:#966006; --court-a:#e9c99a; --court-b:#d9b27c; --court-line:rgba(255,255,255,.55); --al-bg:#fff6e2; --al-line:#e6c37f; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#edf1f6; --surface:#ffffff; --raise:#f3f6fa; --line:#d6dde8; --line-soft:#e5eaf1;
  --fg:#0f1a2d; --muted:#56637d; --faint:#8592aa;
  --accent:#086672; --accent-soft:rgba(8,102,114,.10); --accent-ink:#ffffff;
  --good:#0c6a41; --good-soft:rgba(12,106,65,.10); --good-ink:#ffffff; --bad:#b02842; --bad-soft:rgba(176,40,66,.09); --warn:#7a4f04; --warn-soft:rgba(122,79,4,.11); --warn-ink:#ffffff;
  --be:#56637d; --credit:#966006; --court-a:#e9c99a; --court-b:#d9b27c; --court-line:rgba(255,255,255,.55); --al-bg:#fff6e2; --al-line:#e6c37f; color-scheme:light;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em}
.brand h1{font-size:24px;font-weight:800;font-style:italic;line-height:1}
.brand .eyebrow{font-size:11px}
.top nav{display:flex;gap:4px;margin-left:auto;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px}
.top nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 12px;border-radius:7px;white-space:nowrap}
.top nav{overflow-x:auto;scrollbar-width:none;max-width:100%}.top nav::-webkit-scrollbar{display:none}
.top nav a:hover{color:var(--fg)}
.top nav a.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.theme-b{margin-left:auto;flex:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.theme-b:hover{color:var(--fg)}.theme-b+nav{margin-left:0}
@media (max-width:599.98px){.top .brand{flex:1 1 0;min-width:0}}

section{padding-block:28px 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:30px;font-weight:800}

/* hero / round strip */
/* status changed: the daily report's alerts for his own players, above Watch before the deadline */
.al{margin-top:20px;border:1px solid var(--al-line,var(--warn));border-radius:14px;background:var(--al-bg,var(--warn-soft));padding:12px 16px}  /* light theme sets its own fill: the brown tint turns grey on the light page */
.al h2{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px;color:var(--warn)}
.al ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.al li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:15px}
.al li .plink{font-weight:700}
.al small{color:var(--muted);font-size:13px}
/* watch before the deadline: a table grouped by missing teammate (stacked rows on a phone) */
.wt{margin-top:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 0 8px}
.wt-h{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:12px 16px 8px}
.wt-h h2{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0}
.wt-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.wt-body{padding:0 8px}
.wt table{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}
.wt th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.wt td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.wt tbody tr:last-child td{border-bottom:0}
.wt td.wt-p{padding-left:22px}.wt td.wt-p .plink{font-weight:700}
.wt .n{text-align:right;font-weight:700;white-space:nowrap}.wt .n small{color:var(--muted);font-weight:500}
.wt .wt-sw{padding-left:16px}
.wt-day{color:var(--muted);font-size:13px;white-space:nowrap}
.wt-call{font-weight:600}.wt-call small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.wt-bar{display:flex;align-items:center;gap:8px;--bar:90px}
.wt-bar i{height:8px;border-radius:4px;background:var(--accent);width:calc(var(--k)*var(--bar));flex:none}
.wt-bar b{font-size:13px;color:var(--accent)}
.wt-grp td,.wt-rows li.wt-grp{background:var(--raise);font-size:13px;padding-block:7px}
.wt-grp .plink{font-weight:700;font-size:14px}
.wt-t{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.wt-t.bad{background:var(--bad-soft);color:var(--bad)}.wt-t.warn{background:var(--warn-soft);color:var(--warn)}
.wt-sep td,.wt-rows li.wt-sep{padding:12px 8px 6px;font-size:14px;font-weight:700;color:var(--muted);border-top:2px solid var(--line)}
.wt-note{margin:8px 16px 2px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.wt-note i{font-style:normal;flex:none;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--raise);border:1px solid var(--line);color:var(--muted)}
.wt-empty{margin-top:20px;display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding:9px 14px;border:1px solid var(--line);border-left:4px solid var(--good);border-radius:var(--r);background:var(--surface);font-size:14px}
.wt-empty b{font-family:var(--display);font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.wt-empty span{color:var(--muted)}
.wt-rows{list-style:none;margin:0;padding:0;display:none}
.wt-rows li{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-bottom:1px solid var(--line-soft)}
.wt-rows li:last-child{border-bottom:0}
.wt-rows li.wt-grp,.wt-rows li.wt-sep{display:block}
.wt-r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.wt-r1 .plink{font-weight:700}
.wt-sn{font-family:var(--display);font-weight:800;font-size:21px;color:var(--accent);line-height:1}
.wt-l2{font-size:13px;color:var(--muted)}
.wt .wt-c1{width:84px}.wt .wt-c2{width:76px}.wt .wt-c3{width:160px}.wt .wt-c4{width:36%}
@media (max-width:759.98px){.wt .wt-c1{width:70px}.wt .wt-c2{width:64px}.wt .wt-c3{width:112px}.wt .wt-c4{width:30%}.wt-bar{--bar:44px}}
@media (max-width:599.98px){.wt-dt{display:none}.wt-rows{display:block}}
.cal{margin-top:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal-h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer}
.cal-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r)}
.cal-t{display:flex;flex-direction:column;gap:2px;min-width:0}.cal-t b{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.cal-t small{color:var(--muted);font-size:13px}
.cal-more{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.cal-more .chev{display:inline-block;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
.cal.open .cal-more .chev{transform:rotate(225deg);margin-top:4px}
.cal .days{padding:0 12px 12px}
.round{display:grid;grid-template-columns:1fr;gap:16px;padding-block:22px 0}
.round-title{display:flex;flex-direction:column;gap:6px}
.datechip{align-self:flex-start;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.round-title h2{font-size:clamp(34px,6vw,54px);font-weight:800;font-style:italic;line-height:.95}
.round-title h2 span{color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:end;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);background:var(--raise)}
.day-h b{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;display:block;line-height:1.05}
.turn{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.day-n{font-size:12px;color:var(--muted);white-space:nowrap}
.games{list-style:none;margin:0;padding:4px 0}
.game{display:grid;grid-template-columns:42px minmax(0,1fr) 18px minmax(0,1fr);align-items:center;gap:6px;padding:8px 14px;position:relative}
.game+.game{border-top:1px solid var(--line-soft)}
.game.has-mine{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.gt{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
/* a played game: final score in place of vs, his players' scores against the deadline projection */
.game.done .gt{font-size:12px;letter-spacing:.04em;text-transform:uppercase}.game.done .vs{font-family:var(--display);font-weight:700;font-size:15px;color:var(--fg);white-space:nowrap}
.game.done .gmine{white-space:normal;overflow:visible;text-overflow:clip}.game.done .gmine .gp{display:block}
.gsc{font-weight:700;color:var(--fg)}.gsc .up{color:var(--good)}.gsc .dn{color:var(--bad)}.gsc small{font-weight:400;color:var(--muted)}
.gside{display:flex;align-items:center;gap:7px;min-width:0}
.gside.away{justify-content:flex-end}
.tn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;font-weight:700}
.tb{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:10.5px;letter-spacing:.02em;color:#fff;background:var(--tc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 0 1px var(--line)}
.gmine{grid-column:2/-1;font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmine::before{content:"Your players: ";font-weight:600;color:var(--muted)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.ctrl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.num-input{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;font-weight:700;font-size:18px}
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:6px 8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-width:34px;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* what matters more: points (teal) vs credit growth (amber) split bar with 5 named stops */
.wmm{gap:0}
/* ends say where they lead; the current split sits in the middle */
.wmm-ends{display:flex;justify-content:space-between;align-items:flex-end;gap:6px 10px;margin-top:8px}
.wmm-ends .a{color:var(--accent)} .wmm-ends .b{color:var(--credit)}
.wmm-dest{flex:0 0 auto;font-size:13px;font-weight:700;line-height:1.2}
.wmm-dest.r{text-align:right}
.wmm-split{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1}
.wmm-split .sep{color:var(--muted)}
.wmm-bar{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:6px 0 0;background:transparent;cursor:pointer;--f:.5}
.wmm-bar::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:linear-gradient(to right,var(--accent) calc(9px + (100% - 18px)*var(--f)),var(--credit) 0)}
.wmm-bar::-moz-range-track{height:14px;border-radius:7px;background:linear-gradient(to right,var(--accent) calc(9px + (100% - 18px)*var(--f)),var(--credit) 0)}
.wmm-bar::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:26px;border-radius:4px;background:var(--fg);border:2px solid var(--surface);margin-top:-6px}
.wmm-bar::-moz-range-thumb{width:4px;height:22px;border-radius:4px;background:var(--fg);border:2px solid var(--surface)}
.wmm-stops{position:relative;height:36px;margin:0 9px}
.wmm-stops button{position:absolute;top:0;width:88px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;font-size:10px;font-weight:700;letter-spacing:.06em;line-height:1.2;text-transform:uppercase;text-align:center;color:var(--muted);cursor:pointer}
.wmm-stops button::before{content:"";width:2px;height:6px;border-radius:1px;background:var(--faint)}
.wmm-stops button.first{transform:translateX(-9px);align-items:flex-start;text-align:left}
.wmm-stops button.first::before{margin-left:8px}
.wmm-stops button.last{transform:translateX(calc(-100% + 9px));align-items:flex-end;text-align:right}
.wmm-stops button.last::before{margin-right:8px}
.wmm-stops button.on{color:var(--fg)}
.wmm-stops button.on::before{background:var(--fg)}
.wmm-explain{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted);min-height:calc(2.9em + 13px)}
.wmm-explain b{color:var(--fg)}
.wmm-flat{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--raise);font-size:12.5px;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.tile{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.tile:last-child{border-right:0}
.tile .v{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.tile .v small{font-size:16px;font-weight:700;color:var(--muted)}
.tile .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.pos{color:var(--good)} .neg{color:var(--bad)}

.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 6px;border-bottom:1px solid var(--line-soft)}
.col-h b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.col-h span{font-size:12.5px;color:var(--muted)}
.pc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--raise);border:1px solid transparent}
.pc.new{border-color:var(--accent)}
.jersey{width:44px;height:44px;border-radius:10px 10px 14px 14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:#fff;letter-spacing:.03em;position:relative}
.jersey::after{content:attr(data-pos);position:absolute;bottom:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--fg);font-size:11px;display:grid;place-items:center;border:1px solid var(--line)}
.pc .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .right{text-align:right;display:flex;flex-direction:column;align-items:end;gap:3px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.badge.cap{background:var(--warn);color:var(--warn-ink)}
.badge.start{background:var(--accent-soft);color:var(--accent)}
.badge.six{background:var(--good-soft);color:var(--good)}
.badge.res{background:var(--warn-soft);color:var(--warn)}
.xp{font-family:var(--display);font-weight:700;font-size:18px;line-height:1}
.chg{font-size:12.5px;font-weight:700}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{font-size:19px;font-weight:800;margin-bottom:10px}
.trade{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.trade:first-of-type{border-top:0}
.trade .o,.trade .i{min-width:0}
.trade .o b{color:var(--bad)} .trade .i b{color:var(--good)}
.trade b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trade small{color:var(--muted);font-size:12px}
.arrow{color:var(--faint);text-align:center}
.ptrades{margin-top:16px}
.trade.fresh,.tx tr.fresh{animation:fresh 1.4s ease-out}
/* trades: one row per trade, Out → In with club badges and this round's game, then what the trade changes */
.tx{overflow-x:auto}
.tx table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tx th{padding:0 8px 6px;text-align:right;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
.tx td{padding:10px 8px;text-align:right;border-top:1px solid var(--line-soft);vertical-align:middle;font-weight:700}
.tx td+td{white-space:nowrap}
.tx th:first-child,.tx td:first-child{text-align:left;padding-left:0}
.tx th:last-child,.tx td:last-child{padding-right:0}
/* every row splits the column the same way, so all the In players start on one line */
.tx-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px 10px;min-width:0}
.tx-ar{flex:none;color:var(--faint);font-weight:800}
.tx-p{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.tx-p .tb{width:28px;height:28px;font-size:10px}
.tx-p>span:last-child{min-width:0}
.tx-p b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-p.o b,.tx-p.o .plink{color:var(--bad)} .tx-p.i b,.tx-p.i .plink{color:var(--good)}
.tx-p small{display:block;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-p small i{font-style:normal} .tx-p small i span{font-weight:700} .tx-p small i .up{color:var(--good)} .tx-p small i .dn{color:var(--bad)}
.tx td.tx-x,.tx th:last-child{width:1%;padding-left:4px}
.tx-del{width:26px;height:26px;border-radius:8px;border:1px solid transparent;background:none;color:var(--faint);font-size:13px;font-weight:700;cursor:pointer;line-height:1}
.tx-del:hover,.tx-del:focus-visible{color:var(--bad);border-color:var(--line);background:var(--bad-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tx-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px}.tx-act .note{font-size:12.5px;max-width:46ch;margin:0}
.tx-picks{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:12px;font-size:12.5px}
.tx-cap td:first-child b{display:block} .tx-cap small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.tx .was{display:block;font-size:11.5px;font-weight:500;color:var(--faint);white-space:nowrap}
.tx .tp{color:var(--accent)} .tx .tc{color:var(--credit)} .tx .neg{color:var(--bad)} .tx .z{color:var(--faint)}
.tx tfoot td{border-top:2px solid var(--line);font-weight:800}
.tx tfoot td:first-child{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.02em}
/* look-ahead: "R7 / R8" game lines under the player and two-round bars in the points column */
.tx th small{display:block;text-transform:none;letter-spacing:0;font-weight:600;color:var(--faint)}
.tx-p small em{font-style:normal;font-weight:800;font-size:10.5px;letter-spacing:.04em;color:var(--faint);margin-right:4px}
.tx .tx-p b .tx-role{font-weight:600;font-size:12px;color:var(--muted)}
.rbars{display:grid;grid-template-columns:auto auto 110px 38px;align-items:center;gap:2px 6px;width:max-content;margin-left:auto}
.rb-l{font-size:10.5px;font-weight:700;color:var(--faint);text-align:left}
.rb-t{position:relative;height:9px;background:var(--line-soft);border-radius:2px}
.rb-t::after{content:"";position:absolute;left:40%;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
.rb-s{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.rb-s.n{background:var(--bad)}
.rb-s.h{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 5px);box-shadow:inset 0 0 0 1px var(--accent)}
.rb-s.h.n{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 5px);box-shadow:inset 0 0 0 1px var(--bad)}
.rb-v{font-size:12px;text-align:right}
.rb-w{font-size:11.5px;font-weight:500;color:var(--faint);white-space:nowrap;text-align:right;padding-right:2px}
.rb-sum{grid-column:3/5;border-top:1px solid var(--line);padding-top:2px;text-align:right;font-size:14px}
.rb-sum .rb-v{font-size:14px}
.rb-h{display:inline-flex;align-items:center;gap:6px}
.ico.rb-info{position:relative;width:18px;height:18px;border-radius:50%;font:800 11px/1 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.ico.rb-info:hover,.ico.rb-info:focus-visible{color:var(--fg);border-color:var(--faint)}
.rb-info .tip{max-width:290px;left:auto;right:-8px;transform:none;text-transform:none;letter-spacing:0;font-weight:500}
.rb-info .tip b{margin-top:6px}.rb-info .tip b:first-child{margin-top:0}
.rb-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.rb-legend i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--accent)}
.rb-legend i.h{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 5px);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:640px){
  .tx-pair{grid-template-columns:minmax(0,1fr)}
  .tx-ar{display:none}
  .tx-p .tb{width:22px;height:22px;font-size:8.5px}
  .tx .was,.tx .u{display:none}
  .tx td{padding-inline:6px}
  .tx th{letter-spacing:.04em}
  /* no room for the bars next to the names on a phone: keep the R7 / R8 numbers and the total */
  .rbars{grid-template-columns:auto auto;gap:1px 5px}.rb-t,.rb-w,.rb-legend-w{display:none}.rb-sum{grid-column:1/3}
  /* and the R7 / R8 lines lose "vs/at" and the position letter, so the matchup itself fits: "R7 VIR (−15%)" */
  .tx-p small.gl .gl-ha,.tx-p small.gl .gl-pos{display:none}
  .tx-p{gap:5px} .tx-p small em{margin-right:2px} .rbars{gap:1px 3px} .tx td.tx-x{padding-left:0}
  .tx tbody td:first-child{min-width:122px} /* the names clip to nothing otherwise: their grid has no minimum width */
}
/* "Just missed": trades under the bar at this setting */
.near{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.near-h{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.near-h span{text-transform:none;letter-spacing:0;font-weight:600}
.near-r{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:13.5px}
.near-r .nm{flex:1 1 220px;min-width:0}
.near-r b.o{color:var(--bad)} .near-r b.i{color:var(--good)} .near-r .ar{color:var(--good);font-weight:800}
.near-r .tp{color:var(--accent);font-weight:700} .near-r .tc{color:var(--credit);font-weight:700}
.chip-toggle.sm{padding:4px 10px;font-size:12.5px}
@keyframes fresh{from{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}to{background:transparent;box-shadow:0 0 0 6px transparent}}
.coachline{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--raise);margin-top:6px;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}
.steps b{font-weight:700}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600}
.note{font-size:12.5px;color:var(--muted)}

/* market */

.mrow{display:grid;grid-template-columns:40px minmax(150px,1.6fr) 62px 62px 70px 64px 64px 150px minmax(110px,1fr) 40px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line-soft)}

.cell-num{font-weight:600;text-align:right}

.ico{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:15px;padding:0}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.res-col{display:flex;flex-direction:column;gap:10px;min-width:0}.res-col>.seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.res-col>.seg::-webkit-scrollbar{display:none}.res-col>.seg button{flex:1 0 auto;padding:7px 14px}

.rg-p{display:flex;align-items:center;gap:8px;min-width:0}.rg-p .jersey{width:26px;height:26px;font-size:9px;flex:none}.rg-p .jersey::after{display:none}

// Club strength from the final scores in the player logs. o is the opponent as {opp, ha}.
// This game's margin ~ Normal(expected margin, 12); a coach scores by the margin (see coachPts).
function teamModel(data){
  const HOME=3,SD=12,PRIOR=6;
  const games={};
  data.players.forEach(p=>(p.log||[]).forEach(g=>{
    const s=(g.res||"").slice(2).split("-").map(Number);if(s.length!==2||s.some(isNaN))return;
    const w=g.res[0]==="W";games[p.team+g.d]={t:p.team,w,m:(w?1:-1)*Math.abs(s[0]-s[1])};
  }));
  const rec={};Object.values(games).forEach(g=>{const r=rec[g.t]=rec[g.t]||{w:0,n:0,sum:0};r.n++;r.sum+=g.m;if(g.w)r.w++;});
  // average margin, counted as if the club had also played PRIOR games at 0, so six games say half as much as their raw average
  const rating=t=>rec[t]?rec[t].sum/(rec[t].n+PRIOR):0;
  const margin=(t,o)=>o?rating(t)-rating(o.opp)+(o.ha==="H"?HOME:-HOME):0;
  // standard normal CDF (Abramowitz-Stegun 7.1.26)
  const cdf=z=>{const x=Math.abs(z)/Math.SQRT2,k=1/(1+.3275911*x);
    const e=1-k*(.254829592+k*(-.284496736+k*(1.421413741+k*(-1.453152027+k*1.061405429))))*Math.exp(-x*x);return z<0?(1-e)/2:(1+e)/2;};
  const winP=(t,o)=>o?cdf(margin(t,o)/SD):.5;
  // win by 1-10 (or OT) +10, 11-20 +20, 21+ +25; lose by 1-10 (or OT) -5, 11-20 -10, 21+ -20
  const TIERS=[[-Infinity,-20,-20],[-20,-10,-10],[-10,0,-5],[0,10,10],[10,20,20],[20,Infinity,25]];
  const coachPts=(t,o)=>{const m=margin(t,o),F=v=>cdf((v-m)/SD);
    return Math.round(TIERS.reduce((a,[lo,hi,pts])=>a+pts*(F(hi)-F(lo)),0)*10)/10;};
  // player win bonus: FPT = PIR + 10% of |PIR| on a win, and his average already holds the club's win rate so far,
  // so a projection x moves by 0.1 × |x| × (this game's win chance − that win rate)
  const winAdj=(t,o,x)=>x&&o&&rec[t]?.1*Math.abs(x)*(winP(t,o)-rec[t].w/rec[t].n):0;
  return {rec:t=>rec[t]?{w:rec[t].w,n:rec[t].n}:undefined,margin,winP,coachPts,winAdj};
}

// How much more (+) or less (-) PIR, in %, opponent o allows to his position than an average team. def: the data's defence table.
function matchup(p,o=p.opp,def=D.defence){
  if(!o||!def||!def[o.opp])return null;
  const v=def[o.opp]["vs_"+p.pos.toLowerCase()];return v==null?null:v;
}
/* ---------- look-ahead ----------
   A trade stays after this round, so Proposal 2 also counts half of his next-round projection: his quality with next round's

   free-trade window, where any trade can be undone for free. */
const LOOK=0.5;

// older data is matched by the names this round's games use.
function nextRound(data,dayKeys){
  const TN=data.teamNext||{},last=dayKeys[dayKeys.length-1]||"",code={},next={};
  data.fixtures.forEach(([d,h,a])=>[[h,a],[a,h]].forEach(([c,o])=>{const g=(TN[c]||[]).find(g=>g.el&&g.d===d);if(g)code[g.opp]=o;}));
  for(const c in TN){const g=TN[c].find(g=>g.el&&g.d>last),o=g&&(g.oc||code[g.opp]);if(o&&TEAMS[o])next[c]={opp:o,ha:g.ha,d:g.d};}

// Chance to play by injury status. Doubtful = "unlikely to play, but there is still a chance" (BasketNews); Day to day = a
// knock that usually still lets him play. Any other status (Return, none) counts as fit.
const PLAY_CHANCE={Out:0,Doubtful:.3,"Day to day":.75};

  });

// project:end

// scorecard:begin
// How each version of the projection did against what really happened, from the history/round-N.json files once their
// actuals are in. Measuring only: the live weights stay as they are. Only players who played are scored; an Out player who
// still played counts as a 0 projection in every version, and a player without an xPTS uses his form in every version.
const SC_VERSIONS=[["xpts","FantaSheet xPTS alone"],["form","Form alone"],["today","Today's projection"],
  ["m25","+ matchup, trust 0.25"],["m50","+ matchup, trust 0.5"],["m75","+ matchup, trust 0.75"],["look","Look-ahead"]];

// rows: [projected, actual, price] → per price band: n, average miss (mae) and bias (+ = projected too high)
function scStats(rows){
  const out={};
  for(const b in SC_BANDS){const q=rows.filter(r=>SC_BANDS[b](r[2])),n=q.length;
    out[b]={n,mae:n?q.reduce((a,[x,y])=>a+Math.abs(x-y),0)/n:null,bias:n?q.reduce((a,[x,y])=>a+x-y,0)/n:null};}
  return out;
}
function scoreRounds(snaps){
  const done=s=>!!(s&&s.actual&&s.actual.players),byRound={};snaps.forEach(s=>byRound[s.round]=s);
  const rounds=snaps.filter(done).map(s=>s.round).sort((a,b)=>a-b),last=rounds.length?rounds[rounds.length-1]:null;
  if(last==null)return {rounds,last};
  const got={coach:{}};SC_VERSIONS.forEach(([k])=>got[k]={}); // version → round → rows
  const add=(k,rnd,x,y,price)=>(got[k][rnd]=got[k][rnd]||[]).push([x,y,price]);
  for(const s of snaps){
    const R=project(s),N=s.round,nx=byRound[N+1];
    // a version's base plus the same win adjustment today's projection gets
    const won=(p,b)=>p.out?0:r1(b+R.TM.winAdj(p.team,R.oppOf[p.team],b));
    for(const p of R.players){
      const a=done(s)?s.actual.players[p.id]:null;
      if(a){
        const m=t=>p.mu==null||p.out?p.x:r1(p.x+r1(t*p.x*p.mu/100));
        add("xpts",N,won(p,p.xpts>0?p.xpts:p.own),a.fpt,p.price);
        add("form",N,won(p,p.own),a.fpt,p.price);
        add("today",N,p.x,a.fpt,p.price);
        add("m25",N,m(.25),a.fpt,p.price);add("m50",N,m(.5),a.fpt,p.price);add("m75",N,m(.75),a.fpt,p.price);
      }

      const a2=done(nx)?nx.actual.players[p.id]:null;
      if(a2&&p.opp2){const x=p.x-p.wa+p.wa2,mm=matchup(p,p.opp2,s.defence);add("look",N+1,p.out?0:r1(x+(mm==null?0:MT*x*mm/100)),a2.fpt,p.price);}
    }
    const ac=done(s)&&s.actual.coaches;
    if(ac)R.coaches.filter(c=>c.opp&&ac[c.team]!=null).forEach(c=>add("coach",N,c.x,ac[c.team],c.price));
  }
  const both=k=>({last:scStats(got[k][last]||[]),season:scStats(Object.values(got[k]).flat())});
  const rows=SC_VERSIONS.map(([key,label])=>({key,label,...both(key)}));
  const best=rows.filter(r=>r.key!=="look"&&r.season.all.n).sort((a,b)=>a.season.all.mae-b.season.all.mae)[0]||null;
  const co=both("coach");
  return {rounds,last,rows,best,coaches:{last:co.last.all,season:co.season.all}};
}
// scorecard:end

// review:begin
// The squad's scores after each turn of a round (#29): projections from its history/round-N.json snapshot, what happened
// from the live player logs. Counted like the game: court and 6th man 100%, bench 50%, captain ×2.
// logs: player id → his live log. saved: the squad he saved; it counts while it is from this round (saved by its last
// turn), else the snapshot's squad at the deadline does. null until the round's first turn is played.
function turnReview(snap,logs,saved){

  const from=saved&&(saved.updated||"")<=last?"saved":"snapshot",sq=from==="saved"?saved:(snap.squad||{});
  const slots=(Array.isArray(sq.slots)&&sq.slots.length?sq.slots:sq.players||[]).slice(0,10);
  const cap=sq.cap&&slots.slice(0,5).includes(sq.cap)?sq.cap:null;
  const played=new Set(Object.values(logs).flat().map(g=>g.d));
  const short=p=>p.short||p.name.split(" ").slice(-1)[0];
  const ps=slots.map((id,i)=>by[id]&&{p:by[id],i}).filter(Boolean);
  const game=p=>(logs[p.id]||[]).find(g=>g.d===p.day);
  let got=0,projSoFar=0,projRound=0;const turns=[];

    const rows=ps.filter(({p})=>p.day===d).map(({p,i})=>{
      const mult=i<6?(p.id===cap?2:1):.5,g=game(p),fpt=g?g.fpt:null;
      return {id:p.id,name:p.name,short:short(p),pos:p.pos,team:p.team,role:i<5?"court":i===5?"six":"bench",cap:p.id===cap,
        mult,fpt,x:p.x,counted:r1((fpt||0)*mult),px:r1(p.x*mult)};});

  const path=capPath(ps.map(({p})=>({...p,sd:spreadOf(p)})),R.dayKeys).path,f=path[0];
  const who=p=>p&&{id:p.id,short:short(p),x:p.x,day:p.day};
  let capCall=null;
  if(f){const done=played.has(f.p.day),g=game(f.p),scored=done?(g?g.fpt:0):undefined;
    capCall={first:who(f.p),next:who(path[1]&&path[1].p),keepAt:f.keepAt,scored,
      call:done?(f.keepAt==null||scored>=f.keepAt?"keep":"move"):null,now:who(by[cap])};}

  // because the armband moves to a later player (keep or move is judged on his raw score, not the doubled one)
  if(capCall&&capCall.call==="move")for(const t of turns)for(const r of t.rows)if(r.cap){
    const m=r.mult/2;got+=r1((r.fpt||0)*m)-r.counted;projSoFar+=r1(r.x*m)-r.px;
    projRound+=r1(r.x*m)-r.px;
    Object.assign(r,{cap:false,moved:true,mult:m,counted:r1((r.fpt||0)*m),px:r1(r.x*m)});}
  if(capCall&&capCall.call==="move"&&capCall.next)projRound+=capCall.next.x;
  return {round:snap.round,from,turns,got:r1(got),projSoFar:r1(projSoFar),projRound:r1(projRound),cap:capCall};
}
// review:end

function init(data){

  // otherwise keep whatever was picked by hand

    if(state.maxTAuto!==k){state.maxT=TW.unlimited?99:4;state.maxTAuto=k;save();}}

  const clubDates={};P.forEach(p=>p.log.forEach(g=>(clubDates[p.team]=clubDates[p.team]||new Set()).add(g.d)));
  P.forEach(p=>{p.abs=absenceOf(p,[...(clubDates[p.team]||[])].sort());});

  window.__planner={get result(){return result},get state(){return state},get byId(){return byId},get orig(){return orig},get coaches(){return coachByTeam},get days(){return dayKeys},withMode,evalSquad,quickObj};

// The Bottom line checklist's to-dos, from the live proposal (#42): each {id, kind, title, detail}.
// title is plain text; detail is a list of [class, text] parts, "pts" for points (teal) and "cr" for credits (amber).

const blNum=v=>(v>0?"+":v<0?"−":"")+Math.abs(Math.round(v*10)/10).toFixed(1);
function blItems(o){
  const items=[];

  // so it gets one check on that teammate, due at the deadline, with both calls spelled out
  o.trades.forEach(({out:a,in:b,ifOut:t})=>{
    if(t)items.push({id:`${o.round}:ifout:${t.id}:${b.id}`,kind:"check",title:`Check ${t.short} before ${o.deadline}`,ps:[t],
      detail:[["",`100% out → trade ${a.short} → ${b.short}\nUncertain or plays → keep ${a.short}`]]});
    items.push({id:`${o.round}:trade:${a.id}>${b.id}`,kind:"trade",title:`Trade ${a.short} → ${b.short}`,ps:[a,b],
    // nx: the half of next round's projection the look-ahead counts (Proposal 2), shown when the trade changes it
    // detail text: one piece of information per line (\n), never dot-separated
    detail:[...(t?[["",`Only if ${t.short} is 100% out\n`]]:[]),["pts",`${blNum(b.x-a.x)} pts`],[""," this round, "],
      ...(Math.abs((b.nx||0)-(a.nx||0))>=0.05?[["pts",blNum((b.nx||0)-(a.nx||0))],[""," next round, "]]:[]),
      ["cr",`${blNum(a.price-b.price)} cr`],[""," bank"]]});});
  if(!o.trades.length)items.push({id:`${o.round}:none`,kind:"none",title:"No trades",
    detail:o.near?[["","Best trade adds "],["pts",`${blNum(o.near.g)} pts`],["",`, under the ${o.bar}-point bar`]]:[["",o.why]]});
  // the captain plan: first captain, then who takes the armband if he scores under what the later turns are still worth
  const [c,...later]=o.cap;
  if(c){const detail=[["pts",`${c.p.x.toFixed(1)} projected`],["",`, best on ${o.dayName(c.p.day)}`]];
    if(later.length&&c.keepAt!=null){detail.push(["",`\nUnder ${Math.ceil(c.keepAt)}+`]);
      later.forEach(s=>detail.push(["",` → ${s.p.short} `],["pts",s.p.x.toFixed(1)]));}
    items.push({id:`${o.round}:captain:${c.p.id}`,kind:"captain",title:`Captain ${c.p.short}`,ps:[c.p],detail});}
  const L=o.lineup;
  if(L){const sum=L.st.reduce((a,p)=>a+p.x,0);
    items.push({id:`${o.round}:lineup:${L.st.map(p=>p.id).join(",")}`,kind:"lineup",title:`Start ${L.st.map(p=>p.short).join(", ")}`,ps:L.st,
      detail:[["pts",`${sum.toFixed(1)} pts`],["",` projected from the five\n${L.form.join("-")}${L.six?`, 6th man ${L.six.short}`:""}`]]});}
  // every check is due before trades close: after the deadline the squad is fixed, so there is nothing left to decide
  o.checks.forEach(k=>items.push({id:`${o.round}:check:${k.p.id}`,kind:"check",title:`Check ${k.p.short} before ${o.deadline}`,ps:[k.p],
    detail:[["pts",`${k.p.x.toFixed(1)} pts`],["",` at risk: ${k.why}${k.swap?`\nIf he is out, start ${k.swap.short}`:""}`]]}));
  return items;
}
// The routine's "Credit gainers to watch: Name (CLUB, price) why; …" line as rows; text when it can't be split; null when there is none.
function blGainers(summary){
  const line=(summary||[]).find(t=>/^Credit gainers to watch:/i.test(t));if(!line)return null;
  const body=line.replace(/^Credit gainers to watch:\s*/i,""),parts=body.replace(/\.\s*$/,"").split(/;\s*/);
  const rows=parts.map(t=>t.match(/^(.+?) \(([A-Z]{3}), ([\d.]+)\)\s*(.*)$/)).filter(Boolean)
    .map(m=>({name:m[1],team:m[2],price:+m[3],why:m[4]}));

function blInputs(){
  const pm=state.pmode==="m"?"m":"q";
  return withMode(pm,()=>{
    const R=result,L=R.ev.L,asCoach=c=>c&&{id:"coach-"+c.team,short:c.name||c.team,x:c.x,price:c.price};
    const trades=tradePairs(R).filter(([a,b])=>a!=null&&b!=null&&byId[a]&&byId[b]).map(([a,b])=>({out:byId[a],in:byId[b]}));
    if(R.coach!==orig.coach&&coachByTeam[orig.coach]&&coachByTeam[R.coach])trades.push({out:asCoach(coachByTeam[orig.coach]),in:asCoach(coachByTeam[R.coach])});

    const W=watchItems();

      const tr=trades.find(t=>t.in.id===x.p.id);if(tr&&!tr.ifOut)tr.ifOut=x.t;});
    // one status check per player: injury status first, then a sat-out game with injury news

}

// Players named in the "Out"/"Doubtful" news lines ("Name (CLUB), ..."): known players by id, the rest by name

}
function newsPanel(){
  // absences: player statuses + names in "Out"/"Doubtful" news lines, grouped by club
  const out=new Map();
  P.forEach(p=>{if(p.status)out.set(p.id,{p,st:p.status});});
  const na=newsAbsences(),extra=na.extra;
  na.byId.forEach((st,id)=>{if(!out.has(id))out.set(id,{p:byId[id],st});});
  const list=[...out.values()].map(x=>({name:x.p.name,team:x.p.team,st:x.st,p:x.p})).concat(extra);
  const mineOut=list.filter(x=>x.p&&orig.players.includes(x.p.id));
  const clubs={};list.forEach(x=>{(clubs[x.team]=clubs[x.team]||[]).push(x);});
  const order=Object.keys(clubs).sort((a,b)=>clubs[b].length-clubs[a].length||(TEAMS[a]||[a])[0].localeCompare((TEAMS[b]||[b])[0]));
  const chip=x=>{const p=x.p,mine=p&&orig.players.includes(p.id),st=String(x.st);
    return `<li class="ab${mine?" mine-ab":""}"><span class="ab-pos">${p?p.pos:"–"}</span>${p?plink(p):esc(x.name)}${p?`<small>${p.price.toFixed(1)}</small>`:""}${/^out$/i.test(st)?"":`<span class="tag ${esc(st)}">${esc(st)}</span>`}</li>`;};
  const groups=order.map(t=>`<div class="ab-club"><div class="ab-h">${badge(t)}<b>${esc((TEAMS[t]||[t])[0])}</b><span>${clubs[t].length}</span></div><ul>${clubs[t].map(chip).join("")}</ul></div>`).join("");
  const other=(D.news||[]).filter(n=>!/^(Out|Doubtful|Injury|Injured)$/i.test(n.tag));
  return `<div class="panel news-card">
      <div class="nc-h"><div><div class="eyebrow" style="margin:0">Injuries &amp; absences</div><h3>${list.length} players out</h3></div>
      <span class="nc-mine ${mineOut.length?"bad":"ok"}">${mineOut.length?`${mineOut.length} in your team: ${mineOut.map(x=>plink(x.p,x.p.short)).join(", ")}`:"✓ None of your players"}</span></div>
      <div class="ab-grid">${groups||'<p class="note">No absences reported.</p>'}</div>
    </div>
    ${other.length?`<div class="panel news-card"><div class="nc-h"><div><div class="eyebrow" style="margin:0">Other news</div></div></div><ul class="news-list">${other.map(n=>`<li><span class="tag ${esc(n.tag)}">${esc(n.tag)}</span><span>${linkify(n.txt)}</span></li>`).join("")}</ul></div>`:""}`;
}
function bindTeam(rerender){
  const $=s=>document.querySelector(s);
  const setPick=p=>{pick=p;rerender();setTimeout(()=>{const q=$("#pkq");if(q)q.focus();},0);};
  document.querySelectorAll("[data-slot]").forEach(b=>{
    const i=+b.dataset.slot;
    b.onclick=()=>{
      if(sel==null){ if(!team.slots[i])setPick({slot:i,q:"",pos:b.dataset.epos||"ALL"}); else {sel=i;rerender();} return; }
      if(sel===i){sel=null;rerender();return;}
      swapSlots(sel,i);sel=null;teamChanged();rerender();
    };
    b.ondragstart=e=>{e.dataTransfer.setData("text/plain",String(i));e.dataTransfer.effectAllowed="move";};
    b.ondragover=e=>{e.preventDefault();b.classList.add("over");};
    b.ondragleave=()=>b.classList.remove("over");
    b.ondrop=e=>{e.preventDefault();const a=+e.dataTransfer.getData("text/plain");if(!isNaN(a)&&a!==i){swapSlots(a,i);sel=null;teamChanged();rerender();}};
  });
  document.querySelectorAll("#formSeg button").forEach(b=>b.onclick=()=>{applyForm(b.dataset.form.split("-").map(Number));sel=null;teamChanged();rerender();});
  document.querySelectorAll("[data-apply]").forEach(at=>at.onclick=()=>{withMode(state.pmode==="m"?"m":"q",applyTrades);rerender();setTimeout(()=>{const m=$("#myteam");if(m)m.scrollIntoView({behavior:"smooth",block:"start"});},0);});
  const cs=$("[data-coach-slot]");if(cs)cs.onclick=()=>setPick({slot:"coach",q:"",pos:"ALL"});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act,id=team.slots[sel];
    if(a==="cap"){team.cap=id;sel=null;teamChanged();}
    else if(a==="remove"){const s2=team.slots.slice();s2[sel]=null;team.slots=s2;if(team.cap===id)team.cap=null;sel=null;teamChanged();}
    else if(a==="replace"){const i=sel;sel=null;setPick({slot:i,q:"",pos:byId[id].pos});return;}
    else if(a==="suggest"){sug=sel;sel=null;rerender();setTimeout(()=>{const x=document.querySelector(".sugg .dr-x");if(x)x.focus();},0);return;}
    else sel=null;
    rerender();
  });
  const bank=$("#bank");if(bank)bank.onchange=e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=0){team.bank=v;teamChanged();rerender();}};
  const rs=$("#resetTeam");if(rs)rs.onclick=()=>{justApplied=0;team=teamFrom(savedTeam);state.team=null;sel=null;orig={players:teamIds(),coach:team.coach};P.forEach(p=>{p.tags=tagsFor(p);});state.budgetTouched=false;state.budget=teamValue();rerender();};
  const cf=$("#connectForm");if(cf)cf.onsubmit=e=>{e.preventDefault();const v=$("#passIn").value.trim();if(!v)return;SYNC.pass=v;const m=$("#passMsg"),btn=cf.querySelector("button");m.textContent="Checking…";btn.disabled=true;
    api("state").then(r=>{
      if(r.status===401){m.textContent="Wrong passcode. Check capital letters (phones often capitalise the first letter).";btn.disabled=false;return;}
      if(!r.ok)throw new Error("server "+r.status);
      return r.json().then(j=>{try{localStorage.setItem(PASSK,v);}catch(e){}const sq=applyRemote(j);if(sq)SQUAD=sq;init(D);});
    }).catch(err=>{btn.disabled=false;m.textContent=(err&&err.name==="AbortError")?"The server took too long. Try again.":"Could not connect ("+((err&&err.message)||"network")+"). Try again.";});};
  const sv=$("#saveTeam");if(sv&&SYNC.mode==="on")sv.onclick=()=>{
    if(!teamValid()){sv.textContent="Finish the team first";return;}
    const tj=teamJSON();sv.disabled=true;sv.textContent="Saving…";
    api("team",{method:"POST",body:JSON.stringify({team:tj})}).then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.error||r.status);
      savedTeam=teamFrom(tj);team=teamFrom(tj);state.team=null;justApplied=0;teamChanged();state.team=null;rerender();
      const b=document.getElementById("saveTeam");if(b){b.textContent="Saved ✓ the daily report will use it";}
    })).catch(e=>{sv.disabled=false;sv.textContent="Save failed: "+(e.message||"try again");});
  };
  else if(sv)sv.onclick=()=>{
    const ta=$("#teamJson"),box=$("#saveHelp");ta.value=JSON.stringify(teamJSON(),null,1);box.hidden=false;
    const fallback=()=>{ta.focus();ta.select();};
    try{navigator.clipboard.writeText(ta.value).then(()=>{sv.textContent="Copied ✓ now open GitHub";},fallback);}catch(e){fallback();}
    box.scrollIntoView({block:"nearest",behavior:"smooth"});
  };
  // suggestions
  document.querySelectorAll("[data-sg-close]").forEach(b=>b.onclick=()=>{sug=null;sugCmp=null;rerender();});
  const sgScrollTop=()=>{const d=document.querySelector(".sugg");if(d)d.scrollTop=0;};
  document.querySelectorAll("[data-sg-cmp]").forEach(b=>b.onclick=()=>{sugCmp=+b.dataset.sgCmp;rerender();sgScrollTop();});
  document.querySelectorAll("[data-sg-back]").forEach(b=>b.onclick=()=>{sugCmp=null;rerender();sgScrollTop();});
  document.querySelectorAll("[data-sg-pick]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.sgPick,slot=sug,old=team.slots[slot],s2=team.slots.slice();s2[slot]=id;team.slots=s2;
    team.bank=r1(team.bank+byId[old].price-byId[id].price);if(team.cap===old)team.cap=slot<5?id:null;
    sug=null;sugCmp=null;teamChanged();rerender();});
  const sa=$("[data-sg-all]");if(sa)sa.onclick=()=>{const slot=sug,pos=byId[team.slots[slot]].pos;sug=null;setPick({slot,q:"",pos});};
  // picker
  document.querySelectorAll("[data-pk-close]").forEach(b=>b.onclick=()=>{pick=null;rerender();});
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("dis"))return;
    const id=+b.dataset.pk,s2=team.slots.slice(),old=s2[pick.slot];s2[pick.slot]=id;team.slots=s2;
    if(old&&byId[old])team.bank=r1(team.bank+byId[old].price-byId[id].price);
    if(team.cap===old)team.cap=pick.slot<5?id:null;
    if(!team.cap&&pick.slot<5&&team.slots.slice(0,5).filter(Boolean).length===5){}
    pick=null;teamChanged();rerender();
  });
  document.querySelectorAll("[data-pk-coach]").forEach(b=>b.onclick=()=>{team.coach=b.dataset.pkCoach;pick=null;teamChanged();rerender();});
  document.querySelectorAll("#pkpos button").forEach(b=>b.onclick=()=>{pick.pos=b.dataset.v;const q=$("#pkq");pick.q=q?q.value:pick.q;document.getElementById("picker-root").innerHTML=picker();bindTeam(rerender);});
  const q=$("#pkq");let t;
  if(q)q.oninput=e=>{clearTimeout(t);t=setTimeout(()=>{pick.q=e.target.value;const pos=q.selectionStart;document.getElementById("picker-root").innerHTML=picker();bindTeam(rerender);const n=$("#pkq");n.focus();n.setSelectionRange(pos,pos);},200);};
}
function bind(){
  const $=s=>document.querySelector(s);
  const rerender=()=>{save();const y=window.scrollY;const db=document.querySelector(".drawer");const dy=db?db.scrollTop:0;render();window.scrollTo(0,y);const nb=document.querySelector(".drawer");if(nb)nb.scrollTop=dy;};
  bindTeam(rerender);
  $("#budget")&&$("#budget").addEventListener("change",e=>{const v=parseFloat(e.target.value);if(!isNaN(v)){state.budget=v;state.budgetTouched=true;rerender();}});
  // while dragging, redraw only the tiles, trades and plan; the full page (mode summaries, market highlights) follows on release
  const lam=$("#lam");
  if(lam){
    lam.addEventListener("input",e=>{
      const i=wmmPos(+e.target.value);state.lam=STOPS[i];wmmSync(i);
      const pm=state.pmode==="m"?"m":"q";
      result=withMode(pm,optimise);const parts=withMode(pm,()=>proposalParts(result));
      $("#propTiles").innerHTML=parts.tiles;$("#propWarn").innerHTML=parts.warn;$("#propTrades").innerHTML=parts.trades;$("#propBody").innerHTML=parts.body;
    });
    lam.addEventListener("change",()=>{rerender();const n=$("#lam");if(n)n.focus({preventScroll:true});});
  }
  document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>{state.lam=STOPS[+b.dataset.stop];rerender();});
  document.querySelectorAll("#maxT button").forEach(b=>b.onclick=()=>{state.maxT=+b.dataset.v;rerender();});
  document.querySelectorAll("#pos button").forEach(b=>b.onclick=()=>{state.pos=b.dataset.v;rerender();});
  document.querySelectorAll("#day button").forEach(b=>b.onclick=()=>{state.day=b.dataset.v;rerender();});
  const so=$("#sort");if(so)so.onchange=e=>{state.sort=e.target.value;rerender();};
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;rerender();});
  const on1=$("#only");if(on1)on1.onclick=()=>{state.only=!state.only;rerender();};
  const tf=$("#tagf");if(tf)tf.onchange=e=>{state.tag=e.target.value||null;rerender();};
  const cl=$("#clear");if(cl)cl.onclick=()=>{state.pins=[];state.avoids=[];state.coachPin=null;rerender();};
  const q=$("#q");let t;if(q)q.addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{state.q=e.target.value;const pos=q.selectionStart;rerender();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);},250);});
  document.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>{const id=+b.dataset.pin;state.avoids=state.avoids.filter(i=>i!==id);state.pins=state.pins.includes(id)?state.pins.filter(i=>i!==id):[...state.pins,id];rerender();});
  document.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{const [o,i]=b.dataset.drop.split(",").map(v=>v?+v:null);
    state.pins=state.pins.filter(x=>x!==i&&x!==o).concat(o);state.avoids=state.avoids.filter(x=>x!==o);rerender();});
  document.querySelectorAll("[data-coach-keep]").forEach(b=>b.onclick=()=>{state.coachPin=b.dataset.coachKeep;rerender();});
  document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{const id=+b.dataset.no;state.pins=state.pins.filter(i=>i!==id);state.avoids=state.avoids.includes(id)?state.avoids.filter(i=>i!==id):[...state.avoids,id];rerender();});
  document.querySelectorAll("[data-open]").forEach(b=>{const go=()=>{state.open=+b.dataset.open;state.dtab="overview";rerender();setTimeout(()=>{const x=document.querySelector(".dr-x");if(x)x.focus();},0);};b.onclick=e=>{e.stopPropagation();go();};b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();go();}};});
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{state.open=null;rerender();});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.dtab=b.dataset.tab;rerender();});
  document.querySelectorAll("#allg button").forEach(b=>b.onclick=()=>{state.allGames=b.dataset.v==="1";rerender();});
  const ct=$("#calToggle");if(ct)ct.onclick=()=>{state.calOpen=!state.calOpen;rerender();};
  document.querySelectorAll("[data-pmode]").forEach(b=>b.onclick=()=>{state.pmode=b.dataset.pmode;justApplied=0;rerender();});
  document.querySelectorAll("[data-team]").forEach(b=>{const go=e=>{e.stopPropagation();e.preventDefault();tp=b.dataset.team;rerender();setTimeout(()=>{const x=document.querySelector(".tpanel .dr-x");if(x)x.focus();},0);};b.onclick=go;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")go(e);};});
  document.querySelectorAll("[data-tp-close]").forEach(b=>b.onclick=()=>{tp=null;rerender();});
  document.querySelectorAll("[data-game]").forEach(b=>b.onclick=e=>{if(e.target.closest(".plink"))return;const k=b.dataset.game;state.rg=state.rg===k?null:k;rerender();});
  document.querySelectorAll("[data-rgt]").forEach(b=>b.onclick=()=>{state.rgt={k:b.dataset.rgk,t:b.dataset.rgt};rerender();});
  document.querySelectorAll("#rf button").forEach(b=>b.onclick=()=>{state.rf=b.dataset.v;rerender();});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const d=b.dataset.day;state.collapsed=state.collapsed.includes(d)?state.collapsed.filter(x=>x!==d):[...state.collapsed,d];rerender();});
  document.querySelectorAll("[data-coach]").forEach(b=>b.onclick=()=>{const t=b.dataset.coach;state.coachPin=state.coachPin===t?null:t;rerender();});
  document.querySelectorAll('a[href="#myteam"],a[href="#team"]').forEach(a=>{if(!a.dataset.page)a.onclick=e=>{e.preventDefault();goPage("team","myteam");};});
}
})();
